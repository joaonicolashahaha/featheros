SERIAL 0 115200
UI vesamenu.c32
MENU TITLE FeatherOS
MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 5
MENU VSHIFT 10
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU HELPMSGROW 16
MENU HELPMSGENDROW 29
MENU COLOR border       30;44   #40ffffff #00000000 std
MENU COLOR title        1;36;44 #ffffffff #00000000 std
MENU COLOR sel          7;37;40 #ff000000 #e0ffffff all
MENU COLOR unsel        37;44   #c0ffffff #00000000 std
MENU COLOR help         37;40   #c0ffffff #00000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR tabmsg       31;40   #60ffffff #00000000 std
MENU CLEAR
MENU IMMEDIATE

DEFAULT featheros
TIMEOUT 50

LABEL featheros
TEXT HELP
Start FeatherOS from the boot medium.
ENDTEXT
MENU LABEL FeatherOS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-featheros
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-featheros.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n

LABEL featheros-ram
TEXT HELP
Copy the whole system into RAM first (slower start, then very fast;
the USB stick can be removed). Needs about 1 GB of free RAM.
ENDTEXT
MENU LABEL FeatherOS (load to RAM)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-featheros
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-featheros.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y

LABEL featheros-lts
TEXT HELP
Start with Arch Linux's stock LTS kernel instead of the FeatherOS kernel
(use this if some hardware doesn't work).
ENDTEXT
MENU LABEL FeatherOS (kernel Arch LTS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power off
COM32 poweroff.c32
