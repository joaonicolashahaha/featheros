# FeatherOS compositor: light effects only. Toggle: Super+Shift+P or the
# feather menu (featheros-effects). Override: ~/.config/picom/picom.conf
#
# xrender backend: the glx backend needs more OpenGL than the GMA 4500M
# (GL 2.1) reliably offers, and xrender is enough for shadows + corners.
backend = "xrender";
vsync = false;

# Soft shadows
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.22;
shadow-offset-x = -12;
shadow-offset-y = -8;

# Small rounded corners
corner-radius = 8;

# No fading, no blur, no animations (CPU cost on a Core 2 Duo)
fading = false;

# Full-screen windows (video, games) bypass the compositor entirely.
unredir-if-possible = true;

detect-rounded-corners = true;
detect-client-opacity = true;
# Repaint the whole screen on each change. With damage tracking on, picom 13's
# xrender backend left windows blank or half-painted when shadows/corners were
# enabled (tested in QEMU). Only costs CPU while something on screen changes.
use-damage = false;

rules = (
    # Panels draw their own rounded shapes; GTK client-side shadows exist already.
    { match = "window_type = 'dock' || window_type = 'desktop'"; shadow = false; corner-radius = 0; },
    { match = "_GTK_FRAME_EXTENTS@"; shadow = false; },
    { match = "fullscreen"; corner-radius = 0; },
    { match = "window_type = 'tooltip'"; shadow = false; corner-radius = 4; },
    { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu'"; corner-radius = 6; },
    { match = "class_g = 'Rofi'"; corner-radius = 12; shadow = true; },
);
