# Intel GMA 4500M (and other pre-Gen9 Intel GPUs): the "intel" DDX with SNA
# accelerates 2D natively and offers TearFree and Xv (mpv), without running
# X through OpenGL like modesetting's glamor does on a GL 2.1 GPU.
Section "OutputClass"
    Identifier "intel"
    MatchDriver "i915"
    Driver "intel"
    Option "AccelMethod" "sna"
    Option "TearFree" "true"
EndSection

# Virtual GPUs have no 3D, so glamor would run OpenGL on the CPU (llvmpipe)
# and cost ~70 MB of RAM in Xorg for nothing. Plain software 2D instead.
# (Driver must be set: a matching OutputClass without one leaves X with none.)
Section "OutputClass"
    Identifier "virtual-gpu"
    MatchDriver "bochs|bochs-drm|virtio_gpu|virtio-pci|qxl|vmwgfx|cirrus|cirrus-qemu"
    Driver "modesetting"
    Option "AccelMethod" "none"
EndSection
