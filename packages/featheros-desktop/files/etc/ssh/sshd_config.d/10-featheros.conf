# FeatherOS remote access (feather menu -> "Ligar acesso remoto"). sshd is off
# by default and off again after every boot. When on, only the key made on
# the FeatherOS build machine (signing/ssh/featheros_remote) may log in:
# no passwords, no root.
AuthorizedKeysFile .ssh/authorized_keys /usr/share/featheros/remote/authorized_keys
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no
