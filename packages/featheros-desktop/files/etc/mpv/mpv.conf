# FeatherOS mpv defaults (Core 2 Duo + GMA 4500M).
# No hardware decoder for H.264 on this GPU: decode on the CPU, keep it cheap.
profile=fast
hwdec=no
# OpenGL output; fall back to Xv (intel driver) or plain X11.
vo=gpu,xv,x11
# EGL, not GLX: Xorg's GLX extension is disabled (10-featheros-no-glx.conf).
gpu-context=x11egl

# YouTube & co. via yt-dlp: H.264 up to 720p30 (what the CPU decodes smoothly).
ytdl-format=bestvideo[height<=?720][fps<=?30][vcodec^=avc1]+bestaudio[acodec^=mp4a]/best[height<=?720][vcodec^=avc1]/best[height<=?720]

# Moderate network cache (default can grow to 150 MB+).
demuxer-max-bytes=32MiB
demuxer-max-back-bytes=8MiB
keep-open=yes
