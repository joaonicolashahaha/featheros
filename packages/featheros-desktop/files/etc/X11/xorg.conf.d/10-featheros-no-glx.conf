# No GLX extension in the X server.
#
# GLX makes Xorg load Mesa (libgallium with LLVM) at startup: on the laptop's
# HDD that took 4.4 s of every boot (measured in Xorg.0.log), and the GMA
# 4500M's driver isn't even found that way (the intel DDX asks for "i965",
# Mesa now calls it "crocus"), so it ended in software rendering anyway.
# Nothing in FeatherOS needs GLX: mpv and Firefox use EGL, which talks to the
# GPU directly; picom uses XRender. Remove this file if an app needs GLX.
# (Disable "glx" in a Module section is not enough: Xorg 21 loads it
# anyway. Turning the extension off skips its initialization, and with it
# loading Mesa.)
Section "Extensions"
    Option "GLX" "Disable"
EndSection
