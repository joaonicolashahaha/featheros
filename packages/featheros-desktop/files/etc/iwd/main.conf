# FeatherOS iwd settings.
#
# USB Wi-Fi adapters (Realtek rtw88/rtw89/rtl8xxxu): keep the interface the
# kernel creates. By default iwd deletes it and creates its own; on the
# laptop that failed for the RTL8822CU ("NEW_INTERFACE failed: Too many open
# files in system"), leaving the adapter without an interface at all.
[DriverQuirks]
DefaultInterface=rtw88_*,rtw89_*,rtl8xxxu
